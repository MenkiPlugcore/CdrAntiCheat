# CdrAntiCheat v0.4.0
# Config is schema-versioned. Missing keys are synchronized automatically on startup.
# Existing administrator values are preserved unless they match a known legacy default
# that must be migrated for the new detection model.

config-version: 4

alerts:
  # always: send in-game staff alerts even when Discord delivery succeeds
  # fallback: only send in-game alerts when Discord delivery is unavailable
  # off: never send in-game alerts
  in-game-mode: fallback
  log-to-file: true
  cooldown-ms: 1000
  minimum-observation-status: ABNORMAL
  observation-cooldown-ms: 5000

integrations:
  discordsrv:
    enabled: true
    # Leave blank to use DiscordSRV's main text channel.
    channel-id: ''

observation:
  enabled: true
  # observe: collect evidence only.
  # enforce: allow configured kick/setback actions. There is no automatic ban in v0.4.0.
  enforcement-mode: enforce

  # Impossible non-finite movement may still be cancelled as a protocol/server safety guard.
  safety-cancel-impossible-movement: true

  max-score: 100.0
  correlation-window-ms: 15000
  same-check-repeat-window-ms: 2500
  same-check-repeat-multiplier: 0.40
  correlation-bonus: 4.0
  default-weight: 8.0

  decay-grace-seconds: 10
  score-decay-per-second: 1.25
  session-timeout-seconds: 60

  thresholds:
    watch: 12.0
    abnormal: 35.0
    suspicious: 60.0
    high-risk: 85.0

  weights:
    bad-movement-a: 18.0
    speed-a: 8.0
    speed-b: 10.0
    fly-a: 10.0
    fly-b: 12.0
    fastbreak-a: 14.0
    fastbreak-b: 10.0
    fastplace-a: 10.0
    reach-a: 12.0
    autoclicker-a: 8.0
    timer-a: 12.0
    bad-packets-a: 18.0
    packet-rate-a: 5.0
    aim-a: 10.0
    multitarget-a: 14.0
    attack-timing-a: 10.0
    killaura-a: 20.0

evidence:
  enabled: true
  session-gap-seconds: 45
  max-sessions-per-player: 5
  max-records-per-session: 40
  runtime-retention-minutes: 120
  entries-per-page: 5
  log-to-file: true
  log-directory: evidence

compatibility:
  floodgate-detection: true

  # Java and Bedrock use the same VL and enforcement thresholds.
  # Only transport normalization differs for known Geyser/Floodgate rotation artifacts.
  equal-enforcement: true

  # Legacy fallback settings. They are ignored while equal-enforcement is true.
  bedrock-threshold-multiplier: 1.0
  bedrock-skip-checks: []

violations:
  decay-per-second: 0.20
  decay-grace-seconds: 8
  offline-retention-seconds: 900

movement-engine:
  # Grace after server-applied knockback/velocity so legal movement does not contaminate checks.
  velocity-grace-ms: 1500

packet-engine:
  teleport-grace-ms: 1500

  timer:
    window-ms: 3000
    max-movement-pps: 22.75
    required-buffer: 6
    sample-interval-ms: 250
    startup-grace-ms: 5000

  bad-packets:
    max-absolute-pitch: 90.01
    required-buffer: 2

  packet-rate:
    max-inbound-pps: 250.0
    required-buffer: 4
    sample-interval-ms: 1000

combat-engine:
  players-only: true
  max-packet-age-ms: 220
  velocity-grace-ms: 150
  min-tps: 18.5
  max-rtt-ms: 350
  max-jitter-ms: 120

  aim:
    min-snap-degrees: 42.0
    max-error-degrees: 0.20
    max-attack-interval-ms: 250
    required-buffer: 4

  multitarget:
    min-distinct-targets: 3
    max-switch-interval-ms: 110
    required-buffer: 2

  attack-timing:
    min-samples: 14
    min-mean-ms: 35.0
    max-mean-ms: 130.0
    max-stddev-ms: 1.25
    required-buffer: 3

  killaura:
    required-score: 4
    required-buffer: 3
    max-switch-interval-ms: 90
    max-switch-age-ms: 140
    min-switch-rotation-degrees: 35.0
    extreme-interval-ms: 20

checks:
  bad-movement-a:
    enabled: true
    alert-vl: 1.0
    kick-vl: 3.0

  # Ground horizontal movement.
  speed-a:
    enabled: true
    max-horizontal-per-tick: 0.46
    required-buffer: 4
    alert-vl: 2.0
    kick-vl: 8.0

  # Air horizontal movement after all legal velocity/flight exemptions.
  speed-b:
    enabled: true
    max-horizontal-per-tick: 0.62
    required-buffer: 5
    alert-vl: 2.0
    kick-vl: 9.0

  # Sustained hover.
  fly-a:
    enabled: true
    max-air-events: 20
    required-hover-buffer: 5
    hover-vertical-absolute-max: 0.030
    setback-vl: 4.0
    alert-vl: 2.0
    kick-vl: 7.0

  # Sustained upward movement after a normal jump should already be descending.
  fly-b:
    enabled: true
    minimum-air-events: 8
    minimum-upward-delta: 0.060
    maximum-upward-delta: 0.750
    required-buffer: 4
    setback-vl: 4.0
    alert-vl: 2.0
    kick-vl: 7.0

  # Start-dig -> successful-break timing on sufficiently hard blocks.
  fastbreak-a:
    enabled: true
    minimum-hardness: 1.0
    minimum-break-ms: 110
    required-buffer: 2
    efficiency-exempt-level: 4
    alert-vl: 2.0
    kick-vl: 5.0

  # Repeated successful breaks at an impossible cadence.
  fastbreak-b:
    enabled: true
    minimum-hardness: 0.5
    minimum-interval-ms: 45
    required-buffer: 4
    alert-vl: 2.0
    kick-vl: 7.0

  # Repeated successful block placements faster than a conservative human/client cadence.
  fastplace-a:
    enabled: true
    minimum-interval-ms: 40
    required-buffer: 5
    alert-vl: 2.0
    kick-vl: 8.0

  reach-a:
    enabled: true
    base-max-distance: 3.75
    max-packet-age-ms: 250
    max-ping-compensation-ms: 200
    compensation-per-ms: 0.0015
    max-jitter-compensation-ms: 80
    jitter-compensation-per-ms: 0.0008
    alert-vl: 2.0
    kick-vl: 10.0

  autoclicker-a:
    enabled: true
    max-cps: 24
    required-buffer: 4
    sample-interval-ms: 250
    alert-vl: 2.0
    kick-vl: 10.0

  timer-a:
    enabled: true
    alert-vl: 2.0
    kick-vl: 12.0

  bad-packets-a:
    enabled: true
    alert-vl: 1.0
    kick-vl: 4.0

  packet-rate-a:
    enabled: false
    alert-vl: 2.0
    kick-vl: -1.0

  aim-a:
    enabled: true
    alert-vl: 2.0
    kick-vl: -1.0

  multitarget-a:
    enabled: true
    alert-vl: 2.0
    kick-vl: -1.0

  attack-timing-a:
    enabled: true
    alert-vl: 2.0
    kick-vl: -1.0

  killaura-a:
    enabled: true
    alert-vl: 2.0
    kick-vl: -1.0

actions:
  kick:
    enabled: true
    # Repeated offenders may be kicked again after this cooldown. Automatic banning is intentionally absent.
    cooldown-ms: 5000
    message: "&cCdrAntiCheat\n&7Unusual client behavior detected.\n&fCheck: &c{check}\n&fEvidence: &e{evidence}\n&fKick count: &e{count}\n&7If you believe this is an error, contact server staff."
